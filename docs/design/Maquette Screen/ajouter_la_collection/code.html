        ::-webkit-scrollbar-thumb:hover { background: #cfdce4; }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col antialiased">
<!-- Header (Transactional context: Close action) -->
<header class="bg-surface-container flex items-center justify-between px-margin-mobile h-touch-target border-b border-outline-variant/10 shrink-0 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Add Item</h1>
</div>
<button aria-label="Help" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">help</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-6 flex flex-col gap-6 w-full max-w-2xl mx-auto pb-32">
<!-- Scanner Hero Action -->
<section class="flex flex-col gap-3">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Fast Entry</h2>
<button class="w-full bg-primary-container text-on-primary-container h-32 rounded-xl border border-primary/20 flex flex-col items-center justify-center gap-3 active:scale-[0.98] transition-transform shadow-[0_2px_10px_rgba(112,93,0,0.1)] hover:bg-primary-fixed relative overflow-hidden group">
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9InAiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTTIwIDBMMCAyMGwyMCAyMCAyMC0yMHoiIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iLjA1IiBmaWxsLXJ1bGU9ImV2ZW5vZGQiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjcCkiLz48L3N2Zz4=')] opacity-50"></div>
<span class="material-symbols-outlined text-[48px] relative z-10 group-hover:scale-110 transition-transform duration-300" data-weight="fill">barcode_scanner</span>
<span class="font-headline-sm text-headline-sm relative z-10">Scan Barcode</span>
</button>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-1">Point your camera at the ISBN or issue barcode</p>
</section>
<div class="flex items-center gap-4 py-2">
<div class="h-px bg-outline-variant/30 flex-1"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Or</span>
<div class="h-px bg-outline-variant/30 flex-1"></div>
</div>
<!-- Manual Entry Form -->
<section class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Manual Entry</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Fill out the details below to add an item manually.</p>
</div>
<div class="bg-surface-container-lowest border border-outline-variant/20 rounded-xl p-card-padding flex flex-col gap-5 shadow-sm">
<!-- Publication (Dropdown) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="publication">Publication</label>
<div class="relative">
<select class="w-full bg-surface-bright border-2 border-outline/20 rounded-lg h-12 px-4 appearance-none font-body-md text-body-md text-on-surface focus:border-tertiary focus:ring-0 transition-colors" id="publication">
<option disabled="" selected="" value="">Select Publication...</option>
<option value="picsou_magazine">Picsou Magazine</option>
<option value="super_picsou_geant">Super Picsou Géant</option>
<option value="mickey_parade">Mickey Parade</option>
<option value="le_journal_de_mickey">Le Journal de Mickey</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Issue Number & Edition Row -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="issue_number">Issue Number</label>
<input class="w-full bg-surface-bright border-2 border-outline/20 rounded-lg h-12 px-4 font-numeric-hero text-[24px] font-bold text-on-surface focus:border-tertiary focus:ring-0 transition-colors placeholder:font-body-md placeholder:font-normal placeholder:text-[16px] placeholder:text-outline-variant" id="issue_number" placeholder="e.g. 542" type="number">
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="edition">Edition / Variant</label>
<input class="w-full bg-surface-bright border-2 border-outline/20 rounded-lg h-12 px-4 font-body-md text-body-md text-on-surface focus:border-tertiary focus:ring-0 transition-colors placeholder:text-outline-variant" id="edition" placeholder="Standard" type="text">
</div>
</div>
<!-- Country (Dropdown) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="country">Country of Origin</label>
<div class="relative">
<select class="w-full bg-surface-bright border-2 border-outline/20 rounded-lg h-12 px-4 appearance-none font-body-md text-body-md text-on-surface focus:border-tertiary focus:ring-0 transition-colors" id="country">
<option selected="" value="FR">France</option>
<option value="IT">Italy (Topolino)</option>
<option value="US">United States (Gladstone/IDW)</option>
<option value="DE">Germany</option>
<option value="OTHER">Other</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Publication Date -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="pub_date">Publication Date</label>
<div class="relative">
<input class="w-full bg-surface-bright border-2 border-outline/20 rounded-lg h-12 px-4 font-body-md text-body-md text-on-surface focus:border-tertiary focus:ring-0 transition-colors [&amp;::-webkit-calendar-picker-indicator]:opacity-0" id="pub_date" type="date">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_today</span>
</div>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Action (Transactional: No Nav Shell) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/10 p-4 pb-safe z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-primary text-on-primary h-touch-target rounded-full font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-md hover:bg-surface-tint">
<span class="material-symbols-outlined" data-weight="fill">add_circle</span>
                Add to Collection
            </button>
</div>
</div>
</body></html>
